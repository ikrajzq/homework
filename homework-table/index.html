<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>homework-table</title>
    <link href="reset.css" rel="stylesheet" />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body class="body">
    <table class="calendar">
      <caption class="month-header">
        Июнь 2025
      </caption>
      <thead>
        <tr>
          <th>пн</th>
          <th>вт</th>
          <th>ср</th>
          <th>чт</th>
          <th>пт</th>
          <th class="weekend">сб</th>
          <th class="weekend">вс</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="6" class="empty-cell"></td>
          <td class="weekend">01</td>
        </tr>
        <tr>
          <td>02</td>
          <td>03</td>
          <td>04</td>
          <td>05</td>
          <td>06</td>
          <td class="weekend">07</td>
          <td class="weekend">08</td>
        </tr>
        <tr>
          <td>09</td>
          <td>10</td>
          <td>11</td>
          <td>12</td>
          <td>13</td>
          <td class="weekend">14</td>
          <td class="weekend">15</td>
        </tr>
        <tr>
          <td>16</td>
          <td>17</td>
          <td>18</td>
          <td>19</td>
          <td>20</td>
          <td class="weekend">21</td>
          <td class="weekend">22</td>
        </tr>
        <tr>
          <td>23</td>
          <td>24</td>
          <td>25</td>
          <td>26</td>
          <td>27</td>
          <td class="weekend">28</td>
          <td class="weekend">29</td>
        </tr>
        <tr>
          <td>30</td>
          <td colspan="6" class="empty-cell"></td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
